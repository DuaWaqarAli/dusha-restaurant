<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORSTAT Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#fff;
color:#222;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
border-bottom:1px solid #eee;
}

.brand{
font-size:22px;
font-weight:600;
letter-spacing:2px;
}

/* MENU */
.menu{
font-size:22px;
cursor:pointer;
}

/* HERO */
.hero{
text-align:center;
padding:30px 20px;
}

.hero h1{
font-size:32px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
border:1px solid #eee;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.price{
color:#b07a8c;
font-weight:600;
}

button{
width:100%;
padding:8px;
background:#222;
color:white;
border:none;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
right:15px;
bottom:15px;
width:280px;
background:white;
border:1px solid #eee;
padding:10px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

.checkout{
background:#25D366;
margin-top:10px;
}

</style>
</head>

<body>

<header>
<div class="menu">☰</div>
<div class="brand">ORSTAT</div>
<div>🛒</div>
</header>

<div class="hero">
<h1>Stationery • Stickers • Gifts</h1>
</div>

<!-- PRODUCTS -->
<div class="products" id="productList"></div>

<!-- CART -->
<div class="cart">
<h4>Cart</h4>
<div id="items"></div>
<p><b>Total: PKR <span id="total">0</span></b></p>
<button class="checkout" onclick="checkout()">Checkout</button>
</div>

<script>

/* =========================
   🗄 DATABASE (EDIT HERE)
   ========================= */

const products = [
{
id:1,
name:"Scrapbook Set",
price:2495,
image:"scrapbook.jpg"
},
{
id:2,
name:"Washi Tape",
price:375,
image:"tape.jpg"
},
{
id:3,
name:"Floral Journal",
price:850,
image:"journal.jpg"
},
{
id:4,
name:"Sticker Pack",
price:499,
image:"stickers.jpg"
},
{
id:5,
name:"Gift Box Set",
price:1599,
image:"giftbox.jpg"
}
];

/* ========================= */

let cart=[];
let total=0;

/* LOAD PRODUCTS */
function loadProducts(){

let box=document.getElementById("productList");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML += `
<div class="card" onclick="add('${p.name}',${p.price})">
<img src="${p.image}">
<div class="card-content">
<h3>${p.name}</h3>
<p class="price">PKR ${p.price}</p>
<button>Add to Cart</button>
</div>
</div>
`;
});

}

loadProducts();

/* CART SYSTEM */

function add(name,price){

let found=cart.find(i=>i.name===name);

if(found){
found.qty++;
}else{
cart.push({name,price,qty:1});
}

updateCart();
}

function updateCart(){

let box=document.getElementById("items");
box.innerHTML="";
total=0;

cart.forEach(i=>{
total += i.price*i.qty;
box.innerHTML += `• ${i.name} x${i.qty}<br>`;
});

document.getElementById("total").innerText=total;
}

/* CHECKOUT */

function checkout(){

let msg="Hello ORSTAT 🌸 I want to order:%0A%0A";

cart.forEach(i=>{
msg += `• ${i.name} x${i.qty} - PKR ${i.price*i.qty}%0A`;
});

msg += `%0ATotal: PKR ${total}`;

window.open("https://wa.me/923023849098?text="+msg,"_blank");
}

</script>

</body>
</html>
