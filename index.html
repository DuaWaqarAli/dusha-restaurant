<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORSTAT by Mariam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#fff7f9,#f4f0ff,#eef9ff);
color:#333;
}

/* HERO */
.hero{
text-align:center;
padding:90px 20px;
background:linear-gradient(120deg,#ffe4ec,#e8e1ff,#dff7ff);
position:relative;
overflow:hidden;
}

.hero h1{
font-size:60px;
letter-spacing:6px;
animation:fadeUp 1s ease;
}

.hero p{
margin-top:10px;
color:#555;
font-size:16px;
}

/* floating glow */
.hero::before,.hero::after{
content:"";
position:absolute;
width:220px;
height:220px;
border-radius:50%;
filter:blur(90px);
opacity:0.5;
}

.hero::before{
background:#ffb6d5;
top:-60px;
left:-60px;
}

.hero::after{
background:#b6d8ff;
bottom:-60px;
right:-60px;
}

/* CATEGORY */
.categories{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:25px;
}

.cat{
padding:8px 15px;
border-radius:20px;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
font-size:13px;
transition:0.3s;
cursor:pointer;
}

.cat:hover{
transform:scale(1.05);
background:#ffe6f0;
}

/* PRODUCTS */
.section-title{
text-align:center;
margin-top:40px;
font-size:26px;
font-weight:600;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
padding:40px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.4s;
animation:fadeUp 0.8s ease;
}

.card:hover{
transform:translateY(-10px) scale(1.02);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
background:#f2f2f2;
}

.card-content{
padding:15px;
}

.card h3{
font-size:15px;
margin-bottom:5px;
}

.price{
color:#ff4f87;
font-weight:600;
margin-bottom:10px;
}

/* BUTTON */
button{
background:#ff6fa3;
border:none;
color:white;
padding:10px;
border-radius:12px;
width:100%;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff3f82;
}

/* CART */
.cart{
position:fixed;
right:20px;
bottom:20px;
width:290px;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(12px);
border-radius:18px;
padding:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

.cart h4{
margin-bottom:10px;
}

.cart-items{
font-size:13px;
max-height:140px;
overflow:auto;
margin-bottom:10px;
}

.checkout{
background:#222;
margin-top:10px;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
color:#777;
}

/* ANIMATION */
@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

@media(max-width:600px){
.hero h1{font-size:38px;}
.products{padding:20px;}
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<h1>ORSTAT</h1>
<p>Stationery • Stickers • Gifts • Vibes</p>

<div class="categories">
<div class="cat">Stationery</div>
<div class="cat">Stickers</div>
<div class="cat">Gifts</div>
<div class="cat">Custom Orders</div>
</div>
</div>

<!-- PRODUCTS -->
<h2 class="section-title">Shop Collection</h2>

<div class="products">

<!-- PRODUCT 1 -->
<div class="card">
<img src="scrapbook.jpg">
<div class="card-content">
<h3>Red Warm Mail Series Scrapbooking Gift Box Set</h3>
<div class="price">PKR 2495</div>
<button onclick="addToCart('Scrapbooking Gift Box Set', 2495)">Add to Cart</button>
</div>
</div>

<!-- PRODUCT 2 -->
<div class="card">
<img src="tape.jpg">
<div class="card-content">
<h3>Stripe Gold Foil Pink Washi Tape</h3>
<div class="price">PKR 375</div>
<button onclick="addToCart('Washi Tape', 375)">Add to Cart</button>
</div>
</div>

<!-- PRODUCT 3 -->
<div class="card">
<img src="journal.jpg">
<div class="card-content">
<h3>Cafe Terrace at Night Gift Box Set</h3>
<div class="price">PKR 2995</div>
<button onclick="addToCart('Gift Box Set', 2995)">Add to Cart</button>
</div>
</div>

</div>

<!-- CART -->
<div class="cart">
<h4>🛒 Your Cart</h4>
<div class="cart-items" id="cartItems"></div>
<div><strong>Total: PKR <span id="total">0</span></strong></div>

<button class="checkout" onclick="checkout()">Checkout on WhatsApp</button>
</div>

<!-- FOOTER -->
<footer>
Made with ♡ by ORSTAT
</footer>

<script>

let cart = [];
let total = 0;

function addToCart(name, price){
cart.push({name, price});
total += price;
updateCart();
}

function updateCart(){
let cartItems = document.getElementById("cartItems");
cartItems.innerHTML = "";

cart.forEach(item=>{
cartItems.innerHTML += "• " + item.name + " - PKR " + item.price + "<br>";
});

document.getElementById("total").innerText = total;
}

function checkout(){

let message = "Hello ORSTAT 🌷 I want to order:%0A%0A";

cart.forEach(item=>{
message += "• " + item.name + " - PKR " + item.price + "%0A";
});

message += "%0ATotal: PKR " + total;

let phone = "923023849098";

window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
}

</script>

</body>
</html>
