<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORSTAT by Mariam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

/* 🌈 MOVING BACKGROUND */
body{
background: linear-gradient(-45deg, #ffe4ec, #efe7ff, #e6f7ff, #fff3d6);
background-size: 400% 400%;
animation: gradientBG 12s ease infinite;
color:#222;
overflow-x:hidden;
}

@keyframes gradientBG {
0% {background-position: 0% 50%;}
50% {background-position: 100% 50%;}
100% {background-position: 0% 50%;}
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

/* HERO */
.hero{
text-align:center;
padding:70px 20px;
}

.hero img{
height:100px;
margin-bottom:10px;
}

.hero p{
margin-top:10px;
color:#555;
letter-spacing:2px;
}

/* FILTERS */
.filters{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px;
}

.filter{
padding:8px 14px;
background:white;
border-radius:20px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
transition:0.3s;
}

.filter:hover{transform:scale(1.05);}

/* SEARCH */
.search{
display:flex;
justify-content:center;
margin:10px;
}

.search input{
padding:10px;
width:250px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
cursor:pointer;
}

.card:hover{transform:translateY(-8px);}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.price{color:#ff4f87;font-weight:600;}

/* BUTTON */
button{
width:100%;
padding:10px;
border:none;
background:#ff6fa3;
color:white;
border-radius:10px;
cursor:pointer;
}

button:hover{background:#ff3f82;}

/* CART */
.cart-overlay{
position:fixed;
top:0;right:0;
width:100%;height:100%;
background:rgba(0,0,0,0.4);
display:none;
}

.cart{
position:fixed;
right:-400px;
top:0;
width:320px;
height:100%;
background:white;
padding:20px;
transition:0.3s;
box-shadow:-10px 0 30px rgba(0,0,0,0.2);
}

.cart.open{right:0;}

.cart h3{margin-bottom:10px;}

.cart-items{
font-size:13px;
height:60%;
overflow:auto;
}

.small{
font-size:12px;
color:#666;
}

.checkout-btn{
background:#222;
margin-top:10px;
}

/* POPUP */
.popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.5);
}

.popup-box{
background:white;
width:320px;
padding:20px;
border-radius:15px;
text-align:center;
}

.popup-box img{
width:100%;
border-radius:10px;
}

/* WHATSAPP */
.wa{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
color:white;
padding:12px 15px;
border-radius:50px;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
color:#777;
}

</style>
</head>
