<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORSTAT Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#fff;
color:#222;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
border-bottom:1px solid #eee;
}

.brand{
font-size:22px;
font-weight:600;
letter-spacing:2px;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:36px;
}

.hero p{
color:#666;
margin-top:8px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
border:1px solid #eee;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.price{
color:#b07a8c;
font-weight:600;
}

/* BUTTON */
button{
width:100%;
padding:8px;
background:#222;
color:white;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div class="brand">ORSTAT</div>
<div>🛒</div>
</header>

<div class="hero">
<h1>Stationery • Stickers • Gifts</h1>
<p>Simple aesthetic store</p>
</div>

<div class="products">

<!-- PRODUCT 1 -->
<div class="card">
<img src="scrapbook.jpg">
<div class="card-content">
<h3>Scrapbook Set</h3>
<p class="price">PKR 2495</p>
<button>Add to Cart</button>
</div>
</div>

<!-- PRODUCT 2 -->
<div class="card">
<img src="tape.jpg">
<div class="card-content">
<h3>Washi Tape</h3>
<p class="price">PKR 375</p>
<button>Add to Cart</button>
</div>
</div>

<!-- PRODUCT 3 -->
<div class="card">
<img src="journal.jpg">
<div class="card-content">
<h3>Floral Journal</h3>
<p class="price">PKR 850</p>
<button>Add to Cart</button>
</div>
</div>

</div>

</body>
</html>
