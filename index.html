<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORSTAT by Mariam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ffffff;
color:#222;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
background:white;
z-index:1000;
}

header img{
height:40px;
}

/* HERO */
.hero{
text-align:center;
padding:70px 20px;
background:#fff;
}

.hero h1{
font-size:40px;
letter-spacing:3px;
}

.hero p{
color:#666;
margin-top:10px;
}

.shop-btn{
margin-top:20px;
padding:12px 20px;
border:none;
background:#222;
color:white;
border-radius:25px;
cursor:pointer;
}

/* CATEGORIES */
.categories{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
padding:20px;
}

.cat{
padding:8px 14px;
background:#f8f8f8;
border-radius:20px;
cursor:pointer;
font-size:13px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:25px;
}

.card{
background:white;
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.price{
color:#c48b9f;
font-weight:600;
margin-top:5px;
}

/* BUTTON */
button{
width:100%;
padding:10px;
border:none;
background:#222;
color:white;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#444;
}

/* CART */
.cart{
position:fixed;
right:20px;
bottom:20px;
width:300px;
background:white;
border:1px solid #eee;
padding:15px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.cart-items{
font-size:13px;
max-height:120px;
overflow:auto;
margin-bottom:10px;
}

.checkout{
background:#c48b9f;
}

/* WHATSAPP */
.wa{
position:fixed;
left:20px;
bottom:20px;
background:#25D366;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
color:#888;
font-size:13px;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<img src="logo.png" alt="ORSTAT Logo">
<div onclick="toggleCart()" style="cursor:pointer;font-size:22px;">🛒</div>
</header>

<!-- HERO -->
<div class="hero">
<h1>ORSTAT</h1>
<p>Stationery • Stickers • Gifts • Vibes</p>
<button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
Shop Now
</button>
</div>

<!-- CATEGORIES -->
<div class="categories">
<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('stationery')">Stationery</div>
<div class="cat" onclick="filter('stickers')">Stickers</div>
<div class="cat" onclick="filter('gifts')">Gifts</div>
</div>

<!-- PRODUCTS -->
<div class="products" id="products">

<div class="card" data-cat="stationery">
<img src="scrapbook.jpg">
<div class="card-content">
<h3>Scrapbook Set</h3>
<div class="price">PKR 2495</div>
<button onclick="add('Scrapbook Set',2495)">Add to Cart</button>
</div>
</div>

<div class="card" data-cat="stickers">
<img src="tape.jpg">
<div class="card-content">
<h3>Washi Tape</h3>
<div class="price">PKR 375</div>
<button onclick="add('Washi Tape',375)">Add to Cart</button>
</div>
</div>

<div class="card" data-cat="stationery">
<img src="journal.jpg">
<div class="card-content">
<h3>Floral Journal</h3>
<div class="price">PKR 850</div>
<button onclick="add('Floral Journal',850)">Add to Cart</button>
</div>
</div>

<div class="card" data-cat="gifts">
<img src="giftbox.jpg">
<div class="card-content">
<h3>Luxury Gift Box</h3>
<div class="price">PKR 1800</div>
<button onclick="add('Luxury Gift Box',1800)">Add to Cart</button>
</div>
</div>

</div>

<!-- CART -->
<div class="cart">
<h4>🛒 Your Cart</h4>
<div id="cartItems"></div>
<div><b>Total: PKR <span id="total">0</span></b></div>
<button class="checkout" onclick="checkout()">Checkout</button>
</div>

<!-- WHATSAPP -->
<div class="wa" onclick="checkout()">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:24px;">
</div>

<footer>
Made with ♡ by ORSTAT
</footer>

<script>

let cart=[];
let total=0;

function add(name,price){
cart.push({name,price});
update();
}

function update(){
let box=document.getElementById("cartItems");
box.innerHTML="";
total=0;

cart.forEach(i=>{
total+=i.price;
box.innerHTML+=`• ${i.name} - PKR ${i.price}<br>`;
});

document.getElementById("total").innerText=total;
}

function checkout(){
let msg="Hello ORSTAT 🌸%0A%0A";
cart.forEach(i=>{
msg+=`• ${i.name} - PKR ${i.price}%0A`;
});
msg+=`%0ATotal: PKR ${total}`;
window.open("https://wa.me/923023849098?text="+msg,"_blank");
}

function filter(cat){
document.querySelectorAll(".card").forEach(c=>{
c.style.display=(cat==="all"||c.dataset.cat===cat)?"block":"none";
});
}

</script>

</body>
</html>
